# tesseract-ocr bundle patch: one insert row, applied after the base bundles.
# "last write wins per row" — no other bundle targets the `tesseract-ocr` id.
- insert:
    - id: tesseract-ocr
      name: '@maxwell-feng/dsh-tesseract-ocr'
      config:
        # Tesseract language(s), "+"-joined, e.g. "eng", "chi_sim", "eng+chi_sim".
        language: eng
        # Privacy-first default: every image is OCR'd. Set true only when you
        # intentionally want genuine vision models to receive original bytes.
        passthrough: false
        # tesseract CLI path. Quote paths that contain spaces, e.g.
        # "C:\Program Files\Tesseract-OCR\tesseract.exe"
        tesseractBin: tesseract
        # Page segmentation mode (tesseract --psm).
        psm: 3
        # Per-image OCR timeout in milliseconds.
        timeoutMs: 60000
        # Max cached OCR results (keyed by attachment id) to bound memory.
        maxCacheEntries: 200
